tasks:
  # Phase 1: 프롬프트 완성
  - id: prompt_review
    category: prompt
    priority: 1
    dependencies: []
    title: 전체 프롬프트 검토
    description: 전체 프롬프트 검토 및 완성
    subtasks:
      - 중간 생성물 뭐가 필요한지
      - 어떻게 깔끔하게 중간 생성물을 관리할지
      - 클린아키텍쳐 요구
    outputs:
      - structured_prompt_files
    validation:
      - all_prompt_sections_complete
      - clear_task_definitions

  # Phase 2: 코드 구현
  - id: code_ue_traffic
    category: code
    subcategory: ue_traffic
    priority: 2
    dependencies: []
    title: UE 트래픽 시뮬레이션
    description: 기존 oai의 여러 UE가 5G를 사용하는 트래픽 시뮬레이션
    requirements:
      - UE_types:
          - 위험 물질을 다루는 정밀 로봇팔
          - 자율주행 차량
          - 군사 드론
          - 스마트폰
          - 방송 카메라
    outputs:
      - add-on/units/networker/system5g/ue_traffic/
    validation:
      - multiple_ue_traffic_simulation_working
      - all_ue_types_simulated

  - id: code_dashboard
    category: code
    subcategory: dashboard
    priority: 1
    dependencies: []
    title: 대시보드 구현
    description: 직관적이고 간단하게 조작 가능한 대시보드
    requirements:
      - topology_view: "네트워크 유닛의 모든 구성원을 토폴로지 관계로 볼 수 있음"
      - system_control: "기본 5G 시스템 조작 (부팅, 셧다운, 재부팅) 가능"
      - scenario_selection: "시나리오 선택 가능"
      - attack_defense_modes:
          - manual: "수동 모드 (파라미터 설정)"
          - auto: "자동 모드 (파라미터 프리셋)"
      - parameters:
          - target_nodes: ["CUCP", "CUUP1", "CUUP2", "DU1", "DU2", "DU3"]
          - attack_methods: "공격할 방법"
          - defense_enabled: "방어 여부"
      - execution_options:
          - gui_button: "GUI상의 실행하기 버튼 클릭"
          - cli_copy: "복사해서 cli에 붙여넣기하여 수동입력"
    references:
      - "https://github.com/bear2u/my-skills/blob/master/skills/landing-page-guide-v2/SKILL.md"
    outputs:
      - add-on/units/dashboard/
    validation:
      - topology_visualization_working
      - system_control_buttons_functional
      - scenario_dropdown_working
      - manual_and_auto_modes_implemented

  - id: code_network_units
    category: code
    subcategory: network_units
    priority: 2
    dependencies: [code_dashboard]
    title: 네트워크 유닛 구현
    description: 각 유닛을 독립된 네임스페이스로 네트워크 분리
    requirements:
      - network_separation:
          - "기존 5G 시스템"
          - "공격자"
          - "감염자"
          - "탐지자"
          - "방어자"
      - attacker:
        - botnet:
            description: "공격자가 슬레이브로 사용할 봇넷을 네트워크 네임스페이스로 구현"
            infection_method: "웜으로 감염자끼리만 확산 감염되는 방식"
        - methodology:
          - f1_setup: "시스템 연결 전/재부팅 시간에 공격"
          - scapy_speed: "스캐피 속도 조절해보기"
          - sniffing:
              method: "ARP로 아이피 얻기"
              known_info: "포트 번호"
              partial_info: "각 모듈 아이피 주소"
              storage: "스니핑으로 얻은 정보는 info.txt에 저장"
        - upgrade:
          - oran_cve: "ORAN CVE 찾기"
          - crash: "크래쉬 일으키기 - 어떤 패킷 보내서 리소스 충분할 때도 gnb를 망가뜨릴지"
          - rate_dos: "high & low rate dos 사용 됐는지"
      - defender:
        - communication: "탐지자와 방어자는 서로 정보를 주고 받음"
    outputs:
      - add-on/units/actioner/attacker/
      - add-on/units/actioner/defender/
      - add-on/units/actioner/detector/
      - add-on/units/networker/
    validation:
      - all_units_in_separate_namespaces
      - botnet_implementation_working
      - sniffing_info_saved_to_file
      - detector_defender_communication_working

  - id: code_scenario
    category: code
    subcategory: scenario
    priority: 2
    dependencies: [code_ue_traffic]
    title: 시나리오 구현
    description: 시나리오마다 다른 UE 사용 및 시각화
    requirements:
      - different_ue_per_scenario: true
      - attack_animation: "UE는 공격 당할 시 어떤 오작동, 피해가 생기는지 애니메이션으로 실감나게 보여주기"
      - backgrounds:
          - 원전
          - 도로
          - 지형 지도
          - 공공장소
          - 집회 현장
      - indicators:
          - type: "LED 인디케이터"
          - states: ["오프라인", "온라인", "서비스불가"]
    outputs:
      - add-on/units/scenario/
    validation:
      - all_scenarios_have_different_ue
      - attack_animations_working
      - indicators_showing_correct_states

  - id: code_statistician
    category: code
    subcategory: statistician
    priority: 3
    dependencies: [code_network_units]
    title: 통계 및 측정 구현
    description: 공격/방어 효과 측정 및 베이즈 테이블
    requirements:
      - bayes_table:
          implementation: "packet numbers로 구현"
          metrics:
            - "공격 전에 탐지하면 오탐 (false positive)"
            - "공격 후에 탐지하는데 정상을 오인하면 오탐 (false negative)"
            - "공격 후에 문제 있는 거만 골라 탐지하면 잘한 거 (true positive)"
            - "공격 후에 탐지 못 해내면 못한 거 (false negative)"
      - attack_effect_measurement:
          metrics:
            - "CPU 사용률: CU/DU 프로세서 부하"
            - "메모리 사용률: 시스템 메모리 소진 정도"
            - "네트워크 지연: F1 인터페이스 응답 시간"
            - "서비스 가용성: UE 연결 성공률"
          constraint: "1-2개 파라미터로 충분히 가능하게, 10개+면 실행불가한 공격"
      - defense_effect_measurement:
          metrics:
            - "탐지 정확도: False Positive/Negative 등 비율"
            - "응답 시간: 공격 탐지부터 대응까지의 시간"
            - "서비스 복구 시간: 공격 중단 후 정상화 시간"
          target: "5개 다 막을 수 있으면 나이스"
    outputs:
      - add-on/units/statistician/
    validation:
      - bayes_table_implemented
      - attack_metrics_measurable
      - defense_metrics_measurable

  - id: code_originality
    category: code
    subcategory: originality
    priority: 3
    dependencies: [code_statistician]
    title: 독창성 평가
    description: feature.txt 읽어보고 독창성 평가
    requirements:
      - read_feature_txt: true
      - evaluate_originality: true
      - find_example_research: "독창적이라고 결론난 기능은 예시 연구나 논문 찾아보기"
      - note: "특별한 부분 필수, 프로그램 잘 돌아가는 게 다가 아님"
    outputs:
      - originality_report.md
    validation:
      - originality_evaluated
      - example_research_found

  - id: code_finalization
    category: code
    subcategory: finalization
    priority: 4
    dependencies: [code_originality]
    title: 코드 마무리
    description: 최종 테스트 및 최적화
    requirements:
      - offline_test: "오프라인일 때 돌아가는지 테스트"
      - recursion_check: "재귀 있는지 체크"
      - code_structure: "코드가 간단하게 소분된 구조인지 확인"
      - compilation: "컴파일해서 속도 높이기"
      - github_finalization:
          branches:
            - "공격자, 감염자, 탐지자, 방어자 다 있는 버전"
            - "탐지자와 방어자만 있는 비침습형 사이드카 컨테이너 추가 버전"
    outputs:
      - final_codebase
      - github_branches
    validation:
      - offline_functionality_verified
      - no_recursion_issues
      - code_well_structured
      - compiled_and_optimized

  # Phase 3: 디자인 다듬기
  - id: design_about_page
    category: design
    subcategory: about_page
    priority: 2
    dependencies: [code_dashboard]
    title: 어바웃 페이지 구현
    description: ORAN과 이 프로그램에 대해서 설명
    outputs:
      - add-on/units/dashboard/about.html

  - id: design_responsive
    category: design
    subcategory: responsive
    priority: 2
    dependencies: [code_dashboard]
    title: 동적 레이아웃 구현
    description: 세로모드도 잘 동작하게
    outputs:
      - responsive_css

  - id: design_landing_page
    category: design
    subcategory: landing_page
    priority: 2
    dependencies: [code_dashboard]
    title: 랜딩페이지 디자인
    description: 아름답게 만들기
    references:
      - "https://github.com/bear2u/my-skills/blob/master/skills/landing-page-guide-v2/SKILL.md"
    outputs:
      - landing_page.html

  - id: design_readme
    category: design
    subcategory: readme
    priority: 3
    dependencies: [code_finalization]
    title: README 작성
    description: 코드 실행 설명하는 순차 그래프 포함
    outputs:
      - add-on/README.md

  - id: design_web_analysis
    category: design
    subcategory: web_analysis
    priority: 3
    dependencies: [code_dashboard]
    title: 웹 분석 및 가이드
    description: 웹투마크다운으로 분석 및 랜딩페이지 가이드
    outputs:
      - web_analysis_report.md

  # Phase 4: 논문 작성
  - id: paper_abstract
    category: documentation
    subcategory: paper
    priority: 3
    dependencies: [code_finalization]
    title: 논문 앱스트랙 작성
    description: 앱스트랙 맞게 작성 확인
    requirements:
      - section_1: "현 상황 / 중요성 / 문제의 원인"
      - section_2: "그로 인해 발생한 문제 / 문제 정의 겸 연구 동기"
      - section_3: "해결 방안 제시 / 방법론 요약"
      - section_4: "기대 효과 / 실험 결과"
      - personal_story:
          - "내가 보안에 처음 입문할 때, 아~~ 어디서부터 배워야 할지 모르겠어서 막막했는데,"
          - "만약 이런 이미 만들어진 코드를 직접 배울 수도 있고, 자유도도 높아서 내가 만든 코드도 적용해서 실험할 수 있는 플랫폼이 있었으면 좋겠다 생각했다."
          - "나 같은 보안 입문자들에게 학습의 진입 장벽을 낮추는데 기여했다고 생각한다."
      - f1_interface_justification:
          - "왜 하필 CU-DU 사이의 F1 인터페이스를 선택했는지"
          - "5g ru는 소범위라 F1을 공격하면 광범위한 영역이 마비됨 -> 집단 통제 가능성"
      - ai_review: "에이아이 냄새 제거 후 그래멀리로 한번 더 검토"
    outputs:
      - add-on/docs/NTUST/paper.tex
    validation:
      - abstract_structure_correct
      - personal_story_included
      - f1_justification_clear

  - id: paper_illustrations
    category: documentation
    subcategory: paper_illustrations
    priority: 3
    dependencies: [paper_abstract]
    title: 논문 삽화 완성
    description: 시스템 구성 시각화 및 스크린샷
    requirements:
      - system_configuration_visualization: true
      - program_screenshots: true
      - mindmap_flowchart: "마인드맵, 플로우차트 형식으로 시각화"
    outputs:
      - add-on/docs/NTUST/illustrations/

  - id: paper_final
    category: documentation
    subcategory: paper
    priority: 4
    dependencies: [paper_illustrations]
    title: 논문 최종 작성
    description: Overleaf로 최종 리포트 작성
    requirements:
      - structure: "구조/도형/스크린샷 적극 활용"
      - technical_analysis:
          - "시간, 공간 복잡도"
          - "수치화"
          - "성능 점수"
          - "유효 조건"
          - "한계점"
          - "어떤 학술적 방식으로, 어떤 툴을 사용하겠다는 결론에 이르렀는지"
      - overleaf_formatting:
          - "날짜.tex로 제목 설정"
          - "아티클 = 등호 위치 일치, \"\"따옴표 통일"
          - "검색 키워드만 {}"
          - "ieee의 사이테이션 코드 스니펫 년도 외에도 월, 날짜 표기해야 함"
          - "doi값 잘 찾기"
      - ieee_style:
          - "페이지 상단 왼쪽에는 왼쪽 정렬로 NTUST CSIE Special Project, 오른쪽에는 오른쪽 정렬로 우리 제목"
          - "페이지 하단 왼쪽에는 왼쪽 정렬로 부제목, 오른쪽에 오른쪽 정렬로 현재 페이지/총 페이지 수"
          - "부록에 깃헙링크 넣기"
    outputs:
      - add-on/docs/NTUST/paper.tex
    validation:
      - all_sections_complete
      - ieee_formatting_correct
      - citations_complete

  # Phase 5: 포스터 제작
  - id: poster_content
    category: documentation
    subcategory: poster
    priority: 4
    dependencies: [paper_final]
    title: 포스터 내용 작성
    description: 논문 각 파트를 요약
    requirements:
      - sections:
          - "문제 의식"
          - "ORAN 구조 설명"
          - "우리의 접근법"
          - "연구 성과"
          - "마무리"
      - text_extraction: "내용에서 텍스트만 추출, 냄새 제거 후 그래멀리로 한번 더 검토"
      - visualization: "논문 시각화"
    outputs:
      - add-on/docs/NTUST/poster.json
    validation:
      - all_sections_summarized
      - text_cleaned

  - id: poster_final
    category: documentation
    subcategory: poster
    priority: 5
    dependencies: [poster_content]
    title: 포스터 최종 제작
    description: 최종 출력 및 주문
    requirements:
      - qr_code: "큐알코드 깃헙링크 갱신"
      - watermark: "학교 원형/바형 로고 + 연구실 로고"
      - output_format: "최종 출력 pdf로 하고 주문 넣기"
    outputs:
      - add-on/docs/NTUST/poster.pdf
    validation:
      - qr_code_updated
      - watermark_added
      - pdf_ready_for_print

  # Phase 6: 데모 영상
  - id: demo_script
    category: documentation
    subcategory: demo
    priority: 4
    dependencies: [code_finalization]
    title: 전체 데모 스크립트 완성
    description: 설명 + 실제 구동 영상 + 결론 구조
    requirements:
      - structure_discussion: true
      - easy_understanding: "이해하기 쉽게, 쉬운 단어로"
      - content:
          - "다들 디도스 공격이라고 들어보셨나요?"
          - "보안 문제가 뉴스에 나올 때면 단골처럼 등장하는 공격 기술이 바로 디도스인데요,"
          - "막연하게만 생각했던 디도스 공격을 보안 학습자가 쉽게 연구해볼 수 있도록 연구 플랫폼을 만들었습니다."
          - "이 프로그램은 5G 통신에 핵심 개념인 기술 오픈소스화에서 출발하는데요,"
          - "현재 이 분야에서 대표적인 오픈소스 프로젝트인 OAI를 기반으로 연구 플랫폼을 애드온처럼 추가했습니다."
          - "이 플랫폼은 기본적으로 5가지 시나리오가 있고요, 각각 ?????입니다."
          - "넽웤 구성은 ?가지가 있으며 공격 기술은 총 ?개, 탐지 기술은 ?개, 방어 기술은 ?개 입니다."
          - "기본 설정된 프리셋 환경 외에도 학습자가 직접 원하는 환경으로 수정 및 적용할 수 있습니다."
          - "각 폴더 내에 원하는 기술 코드를 짜서 넣고 새로고침만 하면 바로 실험해볼 수 있습니다."
      - practice: "한 달을 매일 연습해서 최종적으로는 외워지도록, 메모 필요 없도록 준비"
    outputs:
      - add-on/docs/NTUST/demo_script.md
    validation:
      - script_complete
      - structure_approved

  - id: demo_partial
    category: documentation
    subcategory: demo
    priority: 4
    dependencies: [demo_script]
    title: 부분 데모 영상 완성
    description: 구성 논의 및 제작
    requirements:
      - structure_discussion: true
      - "1 proper example of attack & defence": true
      - "easy vocabulary easy understand": true
    outputs:
      - add-on/docs/NTUST/example.mp4
    validation:
      - video_quality_good
      - example_clear

  - id: demo_full
    category: documentation
    subcategory: demo
    priority: 5
    dependencies: [demo_partial]
    title: 전체 데모 영상 완성
    description: DDoS에 대한 설명 짧게 포함
    outputs:
      - add-on/docs/NTUST/demo.mp4
    validation:
      - full_demo_complete
      - ddos_explanation_included

  # Phase 7: 교수님 문서
  - id: prof_timeline
    category: documentation
    subcategory: professor
    priority: 5
    dependencies: [code_finalization]
    title: 프로젝트 타임라인 작성
    description: 전체 타임라인 계획서 및 이행 기록
    requirements:
      - plan: "전체 타임라인 계획서"
